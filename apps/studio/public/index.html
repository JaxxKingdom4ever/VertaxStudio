<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vertax Studio</title>
  <link rel="stylesheet" href="./studio.css">
</head>
<body>
  <div id="vertax-studio" class="studio-shell" aria-label="Vertax Studio">
    <header class="studio-toolbar"><strong>VERTAX</strong><span>Studio</span></header>
    <aside id="project-panel" class="studio-panel project-panel"><h2>Project</h2></aside>
    <main id="graph-canvas" class="graph-canvas" tabindex="0"><div class="canvas-empty">Graph Canvas</div></main>

    <footer id="status-bar" class="status-bar">Ready</footer>
  </div>
  <script type="module" src="/apps/studio/src/main.js"></script>
</body>
</html>
